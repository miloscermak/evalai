<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d9488">
  <title>EvalAI — mapa účastníků</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body class="dashboard-body">
  <header class="dash-header">
    <div class="dash-title">
      <strong id="dash-brand">EvalAI · mapa účastníků</strong>
      <span id="workshop-label"></span>
    </div>
    <div class="dash-meta">
      <span id="count">0</span>
      <button id="export-json-btn" class="btn-pill">JSON</button>
      <button id="export-md-btn" class="btn-pill">MD</button>
      <button id="refresh-btn" class="btn-icon">↻</button>
      <a id="lang-toggle" class="lang-toggle" href="#"></a>
    </div>
  </header>

  <main class="dash-main">
    <div id="plot-wrap" class="plot-wrap">
      <svg id="plot" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet"></svg>
      <div id="tooltip" class="tooltip" hidden></div>
    </div>

    <aside class="legend">
      <div class="quadrant-legend" id="quadrant-legend"></div>
      <div class="archetype-key">
        <small id="flag-note"></small>
      </div>
    </aside>
  </main>

  <div id="loading" class="loading" hidden></div>
  <div id="error" class="error-banner" hidden></div>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
